name: Bug report
description: Report a reproducible bug or unexpected behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting a new report.
        Do not include secrets, credentials, private keys, or sensitive data.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what happened and what you expected.
      placeholder: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected component
      placeholder: GitHub Actions, Cosign, Kyverno, Gatekeeper, Docker, etc.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Docker, Kubernetes, Kind, Helm versions
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and sensitive information before sharing.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
