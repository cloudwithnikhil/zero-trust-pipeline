name: Zero-Trust CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Hardening: weekly re-scan so newly published CVEs surface without a code change.
  # Runs validate + gatekeeper-test only (publish-and-sign and admission-test are skipped).
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# Hardening: one run per ref; superseded PR runs are cancelled, main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/cloudwithnikhil/zero-trust-pipeline:${{ github.sha }}

# Hardening: every third-party action is pinned to a full commit SHA (tag kept in the comment).
# Let Dependabot (package-ecosystem: github-actions) raise PRs to update them.

jobs:
  validate:
    name: Build, Scan and Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build container image
        id: build-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          tags: ${{ env.IMAGE }}
          load: true
          push: false

      - name: Generate SPDX SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: zero-trust-demo-sbom
          upload-artifact: true
          upload-release-assets: false

      - name: Scan image for vulnerabilities
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ env.IMAGE }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          # Optional: uncomment to ignore High/Critical findings that have no upstream fix yet.
          # only-fixed: true

      - name: Save Grype JSON report
        if: always()
        env:
          GRYPE_JSON_PATH: ${{ steps.grype.outputs.json }}
        shell: bash
        run: |
          if [[ -n "$GRYPE_JSON_PATH" && -f "$GRYPE_JSON_PATH" ]]; then
            cp "$GRYPE_JSON_PATH" grype-results.json
            echo "Grype JSON report saved."
          else
            echo "Grype JSON report was not available."
          fi

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence
          path: |
            grype-results.json
            sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Export validated image
        run: docker save "$IMAGE" -o image.tar

      - name: Upload validated image for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-container-image
          path: image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Write CI security summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build-image.outcome }}
          SBOM_RESULT: ${{ steps.sbom.outcome }}
          GRYPE_RESULT: ${{ steps.grype.outcome }}
        shell: bash
        run: |
          {
            echo "## Zero-Trust CI Security Report"
            echo
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Image:** \`${IMAGE}\`"
            echo
            echo "| Control | Result | Details |"
            echo "|---|---|---|"
            echo "| Image build | ${BUILD_RESULT:-not run} | Docker Buildx |"
            echo "| SPDX SBOM | ${SBOM_RESULT:-not run} | sbom.spdx.json |"
            echo "| Grype scan | ${GRYPE_RESULT:-not run} | High/Critical severity gate |"
            echo
            echo "Security evidence artifact: \`security-evidence\`."
            echo "The SBOM is also uploaded as \`zero-trust-demo-sbom\`."
            echo
            echo "Kyverno and Gatekeeper admission policies are tested in the \`admission-test\` and \`gatekeeper-test\` jobs."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-and-sign:
    name: Publish to GHCR and Sign with Cosign
    needs: validate
    outputs:
      image_ref: ${{ steps.sign-image.outputs.image_ref }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download validated image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-container-image
          path: .

      - name: Load validated image
        run: docker load --input image.tar

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish validated image
        run: docker push "$IMAGE"

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign published image using GitHub OIDC
        id: sign-image
        shell: bash
        run: |
          set -euo pipefail

          DIGEST_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"

          if [[ -z "$DIGEST_REF" || "$DIGEST_REF" == "<no value>" ]]; then
            echo "Could not determine the published image digest."
            exit 1
          fi

          echo "Published immutable image reference: $DIGEST_REF"
          echo "image_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

          {
            echo "Image reference: $DIGEST_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Expected issuer: https://token.actions.githubusercontent.com"
            echo "Expected identity: https://github.com/cloudwithnikhil/zero-trust-pipeline/.github/workflows/ci.yml@refs/heads/main"
          } > image-signing-evidence.txt

          cosign sign --yes "$DIGEST_REF"

      - name: Verify published image signature
        id: verify-signature
        env:
          IMAGE_REF: ${{ steps.sign-image.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail

          cosign verify \
            --certificate-identity "https://github.com/cloudwithnikhil/zero-trust-pipeline/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF" > cosign-verification.json

          echo "Cosign verification passed for $IMAGE_REF"

      - name: Upload signing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-signing-evidence
          path: |
            image-signing-evidence.txt
            cosign-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write publishing and signing summary
        if: always()
        env:
          IMAGE_REF: ${{ steps.sign-image.outputs.image_ref }}
          SIGN_RESULT: ${{ steps.sign-image.outcome }}
          VERIFY_RESULT: ${{ steps.verify-signature.outcome }}
        shell: bash
        run: |
          {
            echo "## Image Publishing and Signing Report"
            echo
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Published image digest:** ${IMAGE_REF:-not available}"
            echo
            echo "| Control | Result |"
            echo "|---|---|"
            echo "| Image signing | ${SIGN_RESULT:-not run} |"
            echo "| Signature verification | ${VERIFY_RESULT:-not run} |"
            echo
            echo "Evidence artifact: \`image-signing-evidence\`."
            echo
            echo "The verification checks the configured GitHub Actions identity and OIDC issuer."
          } >> "$GITHUB_STEP_SUMMARY"

  admission-test:
    name: Kubernetes Image Admission Tests
    needs: [validate, publish-and-sign]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.publish-and-sign.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Create disposable Kind cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: zero-trust
          node_image: kindest/node:v1.35.0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Install Kyverno
        shell: bash
        run: |
          set -euo pipefail
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update

          helm upgrade --install kyverno kyverno/kyverno \
            --namespace kyverno \
            --create-namespace \
            --version 3.9.2 \
            --wait \
            --timeout 5m

      - name: Wait for Kyverno admission webhook
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/kyverno-admission-controller \
            -n kyverno --timeout=180s

          kubectl wait \
            --for=condition=Ready \
            pod \
            -l app.kubernetes.io/component=admission-controller \
            -n kyverno \
            --timeout=180s

          for attempt in $(seq 1 30); do
            ENDPOINTS="$(kubectl get endpoints kyverno-svc \
              -n kyverno \
              -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"

            if [[ -n "$ENDPOINTS" ]]; then
              echo "Kyverno service endpoints: $ENDPOINTS"
              exit 0
            fi

            sleep 2
          done

          echo "Kyverno service has no ready endpoints." >&2
          kubectl get pods,svc,endpoints -n kyverno
          kubectl logs deployment/kyverno-admission-controller \
            -n kyverno --tail=150 || true
          exit 1

      - name: Create protected namespace
        run: |
          kubectl create namespace zero-trust-demo

      - name: Apply image signature policy
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            set +e
            output="$(kubectl apply \
              -f kubernetes/policies/verify-signed-images.yaml 2>&1)"
            status=$?
            set -e

            if [[ "$status" -eq 0 ]]; then
              echo "$output"
              exit 0
            fi

            echo "$output"

            if [[ "$output" == *"connection refused"* ||
                  "$output" == *"context deadline exceeded"* ||
                  "$output" == *"no endpoints available"* ]]; then
              echo "Transient webhook connectivity failure ($attempt/12)."
              sleep 5
              continue
            fi

            echo "Policy application failed for a non-retryable reason." >&2
            exit "$status"
          done

          echo "Kyverno webhook remained unavailable after retries." >&2
          exit 1

      - name: Wait for image verification policy readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            READY="$(kubectl get imagevalidatingpolicy \
              verify-zero-trust-demo \
              -o jsonpath='{.status.conditionStatus.ready}' 2>/dev/null || true)"

            if [[ "$READY" == "true" ]]; then
              echo "ImageValidatingPolicy is ready."
              exit 0
            fi

            sleep 5
          done

          kubectl get imagevalidatingpolicy verify-zero-trust-demo -o yaml
          echo "ImageValidatingPolicy did not become ready." >&2
          exit 1

      - name: Select trusted signed image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "SIGNED_IMAGE=ghcr.io/cloudwithnikhil/zero-trust-pipeline:${COMMIT_SHA}" >> "$GITHUB_ENV"
          else
            # PR / manual runs have no freshly signed image, so they reuse a known-good signed build.
            # Hardening TODO: pin this by digest (…@sha256:cd4f2146…) or store it in a repo variable.
            echo "SIGNED_IMAGE=ghcr.io/cloudwithnikhil/zero-trust-pipeline:aa772d516a8238a10e589f06cb88f169e6865ff3" >> "$GITHUB_ENV"
          fi

      - name: Test signed and unsigned image admission
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-image-admission.sh

      - name: Diagnose Kyverno on admission failure
        if: failure()
        shell: bash
        run: |
          kubectl get pods -n kyverno -o wide || true
          kubectl get svc,endpoints -n kyverno || true
          kubectl get events -n kyverno \
            --sort-by=.lastTimestamp || true
          kubectl get mutatingwebhookconfigurations \
            -o yaml || true
          kubectl get validatingwebhookconfigurations \
            -o yaml || true
          kubectl logs deployment/kyverno-admission-controller \
            -n kyverno --tail=200 || true
          kubectl describe deployment kyverno-admission-controller \
            -n kyverno || true

      - name: Write admission test summary
        if: always()
        run: |
          {
            echo "## Kubernetes Image Admission Tests"
            echo
            echo "- Kyverno chart: 3.9.2"
            echo "- Unsigned image must be denied."
            echo "- Trusted signed image must be admitted."
            echo "- Tests use server-side dry runs."
          } >> "$GITHUB_STEP_SUMMARY"

  gatekeeper-test:
    name: Gatekeeper Registry Policy Tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Create disposable Kind cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: gatekeeper-test
          node_image: kindest/node:v1.35.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Install Gatekeeper
        shell: bash
        run: |
          set -euo pipefail

          helm repo add gatekeeper https://open-policy-agent.github.io/gatekeeper/charts
          helm repo update

          # Hardening TODO: pin the chart like Kyverno above, e.g. add: --version <x.y.z>
          # (use the version you validated with: helm list -n gatekeeper-system).
          helm upgrade --install gatekeeper gatekeeper/gatekeeper \
            --namespace gatekeeper-system \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Wait for Gatekeeper admission controller
        run: |
          kubectl rollout status deployment/gatekeeper-controller-manager \
            --namespace gatekeeper-system \
            --timeout=180s

      - name: Create protected namespace
        run: |
          kubectl create namespace zero-trust-demo

      - name: Apply Gatekeeper constraint template
        run: |
          kubectl apply -f kubernetes/policies/gatekeeper-constraint-template.yaml

      - name: Wait for Gatekeeper constraint CRD
        shell: bash
        run: |
          set -euo pipefail

          CRD="k8sallowedregistry.constraints.gatekeeper.sh"

          for attempt in $(seq 1 60); do
            if kubectl wait \
              --for=condition=Established \
              "crd/$CRD" \
              --timeout=2s >/dev/null 2>&1; then
              echo "Generated constraint CRD is established."
              kubectl get constrainttemplate k8sallowedregistry
              kubectl get crd "$CRD"
              exit 0
            fi

            sleep 2
          done

          echo "Gatekeeper did not establish the expected constraint CRD." >&2
          kubectl get constrainttemplates
          kubectl get constrainttemplate k8sallowedregistry -o yaml || true
          kubectl get crd "$CRD" -o yaml || true
          kubectl logs deployment/gatekeeper-controller-manager \
            --namespace gatekeeper-system \
            --tail=100 || true
          exit 1

      - name: Apply allowed-registry constraint
        run: |
          kubectl apply -f kubernetes/policies/gatekeeper-allowed-registry.yaml

      - name: Allow constraint to synchronize
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if kubectl get k8sallowedregistry allow-ghcr-only >/dev/null 2>&1; then
              sleep 5
              exit 0
            fi
            sleep 2
          done

          echo "Gatekeeper constraint was not available." >&2
          exit 1

      - name: Test approved and denied registries
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-gatekeeper-registry.sh

      - name: Write Gatekeeper test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Gatekeeper Registry Policy Tests"
            echo
            echo "- Gatekeeper runs in a disposable Kind cluster."
            echo "- Approved GHCR image must be admitted."
            echo "- Unapproved Docker Hub image must be denied."
            echo "- Tests use server-side dry runs."
          } >> "$GITHUB_STEP_SUMMARY"