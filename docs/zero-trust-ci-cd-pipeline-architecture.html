<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zero-Trust CI/CD Pipeline: Animated Architecture</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--fg:#1f2328;--muted:#656d76;--line:#c3cad2;--node:#fff;--stroke:#8c959f;--accent:#2f6fed;--ok:#1a9a4a;--bad:#d1242f;--zone:#eaf0fb;--zoneStroke:#9db7ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--muted:#8b949e;--line:#3d444d;--node:#1c2330;--stroke:#59636e;--accent:#5b92ff;--ok:#3fb968;--bad:#ff6b73;--zone:#12203a;--zoneStroke:#2f4f8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--muted:#8b949e;--line:#3d444d;--node:#1c2330;--stroke:#59636e;--accent:#5b92ff;--ok:#3fb968;--bad:#ff6b73;--zone:#12203a;--zoneStroke:#2f4f8f;color-scheme:dark}
html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 28px}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;font-size:.88rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.svgbox{overflow-x:auto}
svg{display:block;width:100%;min-width:760px;height:auto}
.node rect{fill:var(--node);stroke:var(--stroke);stroke-width:1.5;transition:all .35s}
.node text{fill:var(--fg);font-size:13px;font-weight:600;text-anchor:middle}
.node text.s{fill:var(--muted);font-size:10.5px;font-weight:400}
.node.done rect{stroke:var(--ok)}
.node.active rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 0 7px var(--accent))}
.node.active.ok rect{stroke:var(--ok);filter:drop-shadow(0 0 7px var(--ok))}
.node.deny rect{stroke:var(--bad);stroke-width:3;filter:drop-shadow(0 0 8px var(--bad))}
.edge{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-dasharray:5 4;opacity:.7}
.zlabel{fill:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
#token{fill:var(--accent);transition:transform .9s cubic-bezier(.4,0,.2,1),fill .3s;filter:drop-shadow(0 0 6px var(--accent));opacity:0}
#token.deny{fill:var(--bad);filter:drop-shadow(0 0 6px var(--bad))}
#token.ok{fill:var(--ok);filter:drop-shadow(0 0 6px var(--ok))}
.cap{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;min-height:64px}
.chip{flex:none;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent);color:#fff;margin-top:2px;white-space:nowrap}
.chip.ok{background:var(--ok)}.chip.deny{background:var(--bad)}
#txt{font-size:.95rem;line-height:1.45}
.dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:.8rem}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.edge{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Zero-Trust CI/CD Pipeline</h1>
  <p class="sub">Scan, sign, and verify before anything runs. Pick a scenario to watch an image travel from commit to cluster.</p>
  <div class="controls" role="group" aria-label="Scenario">
    <button data-s="signed" aria-pressed="true">✅ Signed image</button>
    <button data-s="unsigned" aria-pressed="false">🚫 Unsigned image</button>
    <button data-s="hub" aria-pressed="false">🚫 Docker Hub image</button>
    <button id="pause" aria-pressed="false">⏸ Pause</button>
  </div>
  <div class="card svgbox">
    <svg id="svg" viewBox="0 0 980 340" role="img" aria-label="Animated architecture of the zero-trust pipeline">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--stroke)"/></marker></defs>
      <rect class="zone" x="170" y="40" width="800" height="110" rx="12"/>
      <text class="zlabel" x="184" y="58">CI · GITHUB ACTIONS</text>
      <rect class="zone" x="50" y="200" width="740" height="120" rx="12"/>
      <text class="zlabel" x="64" y="218">KUBERNETES CLUSTER (KIND) · ADMISSION CONTROL</text>
      <g id="edges"></g>
      <g id="nodes"></g>
      <circle id="token" r="9" cx="0" cy="0"/>
    </svg>
  </div>
  <div class="card cap"><span class="chip" id="chip">Ready</span><div><div id="txt"></div><div class="dots" id="dots"></div></div></div>
  <div class="legend"><span><b style="background:var(--accent)"></b>In progress</span><span><b style="background:var(--ok)"></b>Passed</span><span><b style="background:var(--bad)"></b>Denied</span></div>
</div>
