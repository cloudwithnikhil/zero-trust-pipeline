<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Zero-Trust CI/CD Pipeline</title>
  <desc id="desc">A secure software delivery pipeline from developer commit through GitHub Actions, build, vulnerability scanning, SBOM generation, GHCR publishing, Cosign signing, Kubernetes admission checks, and a hardened pod.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 27px; font-weight: 750; }
      .subtitle { font-size: 14px; fill: #596579; }
      .zone-label { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #4b5f83; }
      .node-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 11px; fill: #596579; text-anchor: middle; }
      .node { fill: #ffffff; stroke: #8995a7; stroke-width: 1.6; }
      .edge { fill: none; stroke: #718096; stroke-width: 2.2; marker-end: url(#arrow); }
      .security { fill: #edf4ff; stroke: #9db7ea; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .good { fill: #eaf8ef; stroke: #249653; stroke-width: 2; }
      .number { fill: #2f6fed; }
      .number-text { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#718096"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#249653"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="18" fill="#f6f8fa"/>
  <text class="title" x="40" y="48">Zero-Trust CI/CD Pipeline</text>
  <text class="subtitle" x="40" y="74">Scan, attest, sign, and verify before an image is allowed to run.</text>

  <rect class="security" x="28" y="100" width="1144" height="205" rx="16"/>
  <text class="zone-label" x="48" y="124">CONTINUOUS INTEGRATION · GITHUB ACTIONS</text>

  <!-- CI nodes -->
  <g transform="translate(45 158)">
    <rect class="node" width="145" height="82" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">1</text>
    <text class="node-title" x="72.5" y="37">Developer</text>
    <text class="node-sub" x="72.5" y="57">git push to main</text>
  </g>
  <g transform="translate(235 158)">
    <rect class="node" width="145" height="82" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">2</text>
    <text class="node-title" x="72.5" y="37">GitHub Actions</text>
    <text class="node-sub" x="72.5" y="57">ci.yml workflow</text>
  </g>
  <g transform="translate(425 158)">
    <rect class="node" width="145" height="82" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">3</text>
    <text class="node-title" x="72.5" y="37">Build image</text>
    <text class="node-sub" x="72.5" y="57">Hardened · non-root</text>
  </g>
  <g transform="translate(615 158)">
    <rect class="node" width="145" height="82" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">4</text>
    <text class="node-title" x="72.5" y="37">Grype scan</text>
    <text class="node-sub" x="72.5" y="57">Fail on high+ findings</text>
  </g>
  <g transform="translate(805 158)">
    <rect class="node" width="145" height="82" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">5</text>
    <text class="node-title" x="72.5" y="37">SBOM</text>
    <text class="node-sub" x="72.5" y="57">SPDX JSON evidence</text>
  </g>
  <g transform="translate(995 158)">
    <rect class="node" width="145" height="82" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">6</text>
    <text class="node-title" x="72.5" y="37">GHCR</text>
    <text class="node-sub" x="72.5" y="57">Publish by digest</text>
  </g>

  <path class="edge" d="M190 199 H229"/>
  <path class="edge" d="M380 199 H419"/>
  <path class="edge" d="M570 199 H609"/>
  <path class="edge" d="M760 199 H799"/>
  <path class="edge" d="M950 199 H989"/>

  <rect class="security" x="28" y="338" width="1144" height="238" rx="16"/>
  <text class="zone-label" x="48" y="362">KUBERNETES CLUSTER · ADMISSION CONTROL</text>

  <!-- Admission path, left-to-right -->
  <g transform="translate(55 405)">
    <rect class="node" width="165" height="92" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">7</text>
    <text class="node-title" x="82.5" y="39">Cosign</text>
    <text class="node-sub" x="82.5" y="59">Keyless sign + verify</text>
    <text class="node-sub" x="82.5" y="74">GitHub OIDC identity</text>
  </g>
  <g transform="translate(285 405)">
    <rect class="node" width="165" height="92" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">8</text>
    <text class="node-title" x="82.5" y="39">API server</text>
    <text class="node-sub" x="82.5" y="59">Admission request</text>
    <text class="node-sub" x="82.5" y="74">Before scheduling</text>
  </g>
  <g transform="translate(515 405)">
    <rect class="node" width="165" height="92" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">9</text>
    <text class="node-title" x="82.5" y="39">Gatekeeper</text>
    <text class="node-sub" x="82.5" y="59">Registry allowlist</text>
    <text class="node-sub" x="82.5" y="74">GHCR only</text>
  </g>
  <g transform="translate(745 405)">
    <rect class="node" width="165" height="92" rx="10"/>
    <circle class="number" cx="16" cy="16" r="10"/><text class="number-text" x="16" y="20">10</text>
    <text class="node-title" x="82.5" y="39">Kyverno</text>
    <text class="node-sub" x="82.5" y="59">Verify signature</text>
    <text class="node-sub" x="82.5" y="74">Trusted workflow + issuer</text>
  </g>
  <g transform="translate(975 405)">
    <rect class="good" width="165" height="92" rx="10"/>
    <circle cx="16" cy="16" r="10" fill="#249653"/><text class="number-text" x="16" y="20">11</text>
    <text class="node-title" x="82.5" y="39">Hardened Pod</text>
    <text class="node-sub" x="82.5" y="59">Non-root · read-only FS</text>
    <text class="node-sub" x="82.5" y="74">Drop caps · no SA token</text>
  </g>

  <path class="edge" d="M220 451 H279"/>
  <path class="edge" d="M450 451 H509"/>
  <path class="edge" d="M680 451 H739"/>
  <path d="M910 451 H969" fill="none" stroke="#249653" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <text x="600" y="546" text-anchor="middle" font-size="13" font-weight="700" fill="#249653">ALLOW only when registry policy and trusted signature verification both pass</text>
  <text x="40" y="602" font-size="11" fill="#6b7280">Illustrative architecture · Adapt policy identities, registry rules, and admission configuration to your repository.</text>
</svg>
