apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-demo
  namespace: zero-trust-demo
  labels:
    app: zero-trust-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zero-trust-demo
  template:
    metadata:
      labels:
        app: zero-trust-demo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/cloudwithnikhil/zero-trust-pipeline:f059b968d0ec0fd4eebea7390374a46be031bcfe@sha256:5eb228a9743ed47fedbfcacbf33d014a033d7338ed19dc7f82ed9570fc913c95
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zero-trust-demo
  namespace: zero-trust-demo
spec:
  type: ClusterIP
  selector:
    app: zero-trust-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
