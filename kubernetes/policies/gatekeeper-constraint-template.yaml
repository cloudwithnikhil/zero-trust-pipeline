apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedregistry
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRegistry
      validation:
        legacySchema: false
        openAPIV3Schema:
          type: object
          properties:
            registries:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedregistry

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          image := container.image
          not startswith(image, "ghcr.io/")
          msg := sprintf("Container image '%v' is not from an approved registry. Allowed registry: ghcr.io/", [image])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          image := container.image
          not startswith(image, "ghcr.io/")
          msg := sprintf("Init container image '%v' is not from an approved registry. Allowed registry: ghcr.io/", [image])
        }